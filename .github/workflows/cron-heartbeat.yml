name: Cron Heartbeat

on:
  schedule:
    # Runs every five minutes, offset from busy clock boundaries.
    - cron: '3/5 * * * *'
  workflow_dispatch:

jobs:
  heartbeat:
    runs-on: ubuntu-latest
    steps:
      - name: Print heartbeat
        run: |
          echo "Scheduled heartbeat received"
          date -u
